<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin tạo key V5.37</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#fff;font-family:Arial,Helvetica,sans-serif}
main{max-width:1050px;margin:auto;padding:22px}
h1{margin:0 0 8px;font-size:30px}.sub{color:#aab3c0;line-height:1.45;margin:0 0 18px}
.card{border:1px solid #2a3039;background:#151922;border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
input{background:#090c10;color:#fff;border:1px solid #3b4552;border-radius:10px;padding:11px;font-weight:900;min-width:280px;flex:1}
button,a.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:1000;cursor:pointer;text-decoration:none;display:inline-flex;color:#fff;background:#1a9cff}
.green{background:#33e35d!important;color:#061008!important}.orange{background:#ffb020!important;color:#1a0d00!important}.red{background:#ff4f4f!important}.dark{background:#222b38!important}
pre{white-space:pre-wrap;word-break:break-word;background:#070a0f;border:1px solid #263241;border-radius:12px;padding:14px;color:#d8f7ff}
label{color:#c8d3df;font-weight:900}small{color:#9aa8b8}.hidden{display:none!important}
#adminStatus{font-weight:900;margin-top:8px;color:#ffd75a}
</style>
</head>
<body>
<main>
<h1>🔐 Admin tạo key</h1>
<p class="sub">Trang này chỉ mở bằng <b>Admin Key</b>. Key người dùng không vào được phần tạo key.</p>

<div id="adminLogin" class="card">
  <label>Admin Key</label>
  <div class="row">
    <input id="adminKey" type="password" placeholder="Nhập ADMIN_KEY">
    <button id="openAdmin" class="green">Mở Admin</button>
    <a class="btn dark" href="login.html?v=537">Trang đăng nhập người dùng</a>
  </div>
  <div id="adminStatus">Chưa xác thực Admin Key.</div>
  <small>Admin Key là secret <b>ADMIN_KEY</b> trong Cloudflare Worker.</small>
</div>

<div id="adminArea" class="hidden">
  <div class="card">
    <h2>Tạo key mới cho người dùng</h2>
    <div class="row">
      <button id="perm" class="green">Tạo key vĩnh viễn</button>
      <button id="d7" class="orange">Tạo key 7 ngày</button>
      <button id="h24" class="orange">Tạo key 24 giờ</button>
    </div>
  </div>

  <div class="card">
    <h2>Kết quả</h2>
    <div id="status">Chưa tạo key.</div>
    <pre id="out"></pre>
    <div class="row">
      <button id="copyKey">Copy Key</button>
      <button id="copyControl">Copy Control Link</button>
      <button id="copyOverlay">Copy Overlay Link</button>
      <button id="copyAvatar">Copy Avatar Setup Link</button>
      <button id="copyLogin">Copy Login Link</button>
    </div>
  </div>
</div>
</main>

<script>
const CFG=window.SAE_CONFIG;
const API=(CFG.backend||"").replace(/\/+$/,"");
adminKey.value=localStorage.getItem("sae_admin_key")||"";
let last=null;
let verified=false;

function makeLink(file, params={}){
 const u=new URL(file,location.href);
 for(const [k,v] of Object.entries(params))if(v!=null&&v!=="")u.searchParams.set(k,v);
 return u.href;
}
async function checkAdmin(){
 const ak=adminKey.value.trim();
 if(!ak){adminStatus.textContent="Nhập Admin Key trước";adminStatus.style.color="#ff6b6b";return false}
 adminStatus.textContent="Đang kiểm tra Admin Key...";
 adminStatus.style.color="#ffd75a";
 try{
  const r=await fetch(`${API}/admin/check`,{
   method:"POST",mode:"cors",cache:"no-store",
   headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
   body:JSON.stringify({adminKey:ak})
  });
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error("bad_admin");
  localStorage.setItem("sae_admin_key",ak);
  verified=true;
  adminArea.classList.remove("hidden");
  adminStatus.textContent="Admin Key OK. Đã mở phần tạo key.";
  adminStatus.style.color="#55ff78";
  return true;
 }catch(e){
  verified=false;
  adminArea.classList.add("hidden");
  adminStatus.textContent="Admin Key sai. Không được tạo key.";
  adminStatus.style.color="#ff6b6b";
  return false;
 }
}
openAdmin.onclick=checkAdmin;

function show(data){
 last=data;
 const exp=data.expiresAt?new Date(data.expiresAt).toLocaleString():"Vĩnh viễn";
 const login=makeLink("login.html",{v:"537",key:data.key,next:"home.html?v=537"});
 const control=makeLink("control.html",{v:"537",key:data.key,room:data.room});
 const overlay=makeLink("index.html",{v:"537",room:data.room});
 const avatar=makeLink("avatar.html",{v:"537",key:data.key,room:data.room});
 out.textContent=`KEY: ${data.key}
ROOM: ${data.room}
Hạn: ${exp}

LOGIN LINK:
${login}

CONTROL LINK:
${control}

OVERLAY LINK:
${overlay}

AVATAR SETUP LINK:
${avatar}`;
 status.textContent="Đã tạo key thành công.";
}
async function createKey(ttl){
 if(!verified){const ok=await checkAdmin();if(!ok)return}
 const ak=adminKey.value.trim();
 status.textContent="Đang tạo key...";
 const r=await fetch(`${API}/admin/create-key`,{
  method:"POST",mode:"cors",cache:"no-store",
  headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
  body:JSON.stringify({adminKey:ak,ttl})
 });
 const data=await r.json().catch(()=>({}));
 if(!r.ok||!data.ok){
  status.textContent="Lỗi tạo key.";
  out.textContent=JSON.stringify(data,null,2);
  return;
 }
 show(data);
}
perm.onclick=()=>createKey("permanent");
d7.onclick=()=>createKey("7d");
h24.onclick=()=>createKey("24h");
copyKey.onclick=()=>last&&navigator.clipboard.writeText(last.key);
copyControl.onclick=()=>last&&navigator.clipboard.writeText(makeLink("control.html",{v:"537",key:last.key,room:last.room}));
copyOverlay.onclick=()=>last&&navigator.clipboard.writeText(makeLink("index.html",{v:"537",room:last.room}));
copyAvatar.onclick=()=>last&&navigator.clipboard.writeText(makeLink("avatar.html",{v:"537",key:last.key,room:last.room}));
copyLogin.onclick=()=>last&&navigator.clipboard.writeText(makeLink("login.html",{v:"537",key:last.key,next:"home.html?v=537"}));
</script>
</body>
</html>
