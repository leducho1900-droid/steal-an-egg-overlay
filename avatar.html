<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar Overlay Setup V5.38</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07090d;color:#fff;font-family:Arial,Helvetica,sans-serif}
main{max-width:1120px;margin:auto;padding:22px}
h1{margin:0 0 8px;font-size:30px}.sub{color:#aab3c0;margin:0 0 18px;line-height:1.45}
.panel{border:1px solid #293340;background:#111820;border-radius:18px;padding:18px;margin:12px 0}
.preview{display:flex;align-items:center;justify-content:center;gap:46px;flex-wrap:wrap;padding:20px 0}
.avatarBox{width:340px;height:340px;border-radius:50%;border:8px solid #f6f6f6;box-shadow:0 0 0 3px #111,0 0 22px rgba(255,255,255,.55) inset;position:relative;background:#000;overflow:hidden}
.avatarBox img{width:100%;height:100%;object-fit:cover;display:none}
.plus{position:absolute;right:38px;bottom:2px;width:94px;height:94px;border-radius:50%;background:#f41111;border:8px solid #fff;display:grid;place-items:center;font:900 70px/1 Arial;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.eq{font:1000 120px/1 "Arial Black";color:#111;-webkit-text-stroke:5px #fff;text-shadow:0 5px 0 #000}
.egg{width:360px;max-width:80vw;filter:drop-shadow(0 5px 0 #000)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button,a.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:1000;cursor:pointer;background:#1a9cff;color:#fff;text-decoration:none;display:inline-flex}
.green{background:#33e35d!important;color:#061008!important}.dark{background:#222b38!important}.orange{background:#ffb020!important;color:#190e00!important}
input[type=text]{background:#090c10;color:#fff;border:1px solid #3b4552;border-radius:10px;padding:11px;font-weight:900;min-width:280px;flex:1}
#file{display:none}.status{color:#9db0c4;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>🖼️ Avatar Overlay Setup</h1>
<p class="sub">Chọn avatar, avatar sẽ nằm trong khung tròn trắng. Sau đó copy link overlay để dán vào TikTok Studio.</p>

<div class="panel">
  <div class="row">
    <input id="keyInput" type="text" placeholder="Nhập key nếu link chưa có key">
    <button id="loginBtn" class="green">Đăng nhập key</button>
    <a class="btn dark" href="home.html?v=538">Quay lại trang đầu</a>
    <a id="controlBack" class="btn dark" href="control.html?v=538">Quay lại Control</a>
  </div>
  <div id="status" class="status">Đang chờ key...</div>
</div>

<div class="panel">
  <div class="preview">
    <div class="avatarBox"><img id="avatarImg"><div class="plus">+</div></div>
    <div class="eq">=</div>
    <img class="egg" src="assets/luminous_eggs_item.png" alt="Luminous Eggs">
  </div>
  <div class="row">
    <button id="choose" class="orange">Chọn Avatar</button>
    <button id="saveAvatar" class="green">Lưu Avatar</button>
    <button id="copyAvatarOverlay">Copy Link Overlay Avatar</button>
    <button id="copyMainOverlay">Copy Link Overlay Chính</button>
    <input id="file" type="file" accept="image/*">
  </div>
</div>
</main>

<script>
const CFG=window.SAE_CONFIG;
const API=(CFG.backend||"").replace(/\/+$/,"");
const URLP=new URLSearchParams(location.search);
let USER_KEY=(URLP.get("key")||localStorage.getItem("sae_user_key")||"").trim();
let ROOM=URLP.get("room")||localStorage.getItem("sae_user_room")||"";
const DEVICE_STORE="sae_device_id_v1";
let DEVICE_ID=localStorage.getItem(DEVICE_STORE);
if(!DEVICE_ID){DEVICE_ID="dev_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(DEVICE_STORE,DEVICE_ID)}
keyInput.value=USER_KEY;
if(!USER_KEY){
 const u=new URL("login.html",location.href);
 u.searchParams.set("v","537");
 u.searchParams.set("next","avatar.html?v=538");
 location.href=u.href;
}
let avatarData="";

function link(file,params={}){
 const u=new URL(file,location.href);
 for(const [k,v] of Object.entries(params))if(v)u.searchParams.set(k,v);
 return u.href;
}
function setStatus(t,c="#9db0c4"){status.textContent=t;status.style.color=c}
async function auth(){
 USER_KEY=keyInput.value.trim();
 if(!USER_KEY){setStatus("Nhập key trước","#ff6b6b");return false}
 localStorage.setItem("sae_user_key",USER_KEY);
 try{
  const r=await fetch(`${API}/auth?_=${Date.now()}`,{
    method:"POST",mode:"cors",cache:"no-store",
    headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
    body:JSON.stringify({key:USER_KEY,deviceId:DEVICE_ID})
  });
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error(data.error||"auth_failed");
  ROOM=data.room;
  localStorage.setItem("sae_user_room",ROOM);
  controlBack.href=link("control.html",{v:"536",key:USER_KEY});
  setStatus("Key OK. Có thể chọn avatar.", "#55ff78");
  await loadAvatar();
  return true;
 }catch(e){
  setStatus("Key lỗi / hết hạn / đã gắn máy khác", "#ff6b6b");
  return false;
 }
}
async function loadAvatar(){
 if(!ROOM)return;
 try{
  const r=await fetch(`${API}/avatar?room=${encodeURIComponent(ROOM)}&_=${Date.now()}`,{cache:"no-store"});
  const data=await r.json();
  if(data&&data.ok&&data.avatar){
    avatarData=data.avatar;
    avatarImg.src=avatarData;
    avatarImg.style.display="block";
  }
 }catch(_e){}
}
function resizeImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
    const max=520;
    let w=img.width,h=img.height;
    const ratio=Math.min(max/w,max/h,1);
    w=Math.round(w*ratio);h=Math.round(h*ratio);
    const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);
    resolve(canvas.toDataURL("image/png"));
  };
  img.onerror=reject;
  img.src=URL.createObjectURL(file);
 });
}
choose.onclick=()=>file.click();
file.onchange=async()=>{
 const f=file.files&&file.files[0]; if(!f)return;
 avatarData=await resizeImage(f);
 avatarImg.src=avatarData;
 avatarImg.style.display="block";
};
saveAvatar.onclick=async()=>{
 if(!ROOM){const ok=await auth();if(!ok)return}
 if(!avatarData){alert("Chọn avatar trước");return}
 setStatus("Đang lưu avatar...","#ffd75a");
 const r=await fetch(`${API}/avatar`,{
  method:"POST",mode:"cors",cache:"no-store",
  headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
  body:JSON.stringify({key:USER_KEY,deviceId:DEVICE_ID,room:ROOM,avatar:avatarData})
 });
 const data=await r.json().catch(()=>({}));
 if(!r.ok||!data.ok){setStatus("Lưu avatar lỗi","#ff6b6b");return}
 setStatus("Đã lưu avatar. Copy link overlay được rồi.","#55ff78");
};
copyAvatarOverlay.onclick=async()=>{
 if(!ROOM){const ok=await auth();if(!ok)return}
 await navigator.clipboard.writeText(link("avatar_overlay.html",{v:"537",room:ROOM}));
 copyAvatarOverlay.textContent="ĐÃ COPY"; setTimeout(()=>copyAvatarOverlay.textContent="Copy Link Overlay Avatar",1200);
};
copyMainOverlay.onclick=async()=>{
 if(!ROOM){const ok=await auth();if(!ok)return}
 await navigator.clipboard.writeText(link("index.html",{v:"537",room:ROOM}));
 copyMainOverlay.textContent="ĐÃ COPY"; setTimeout(()=>copyMainOverlay.textContent="Copy Link Overlay Chính",1200);
};
loginBtn.onclick=auth;
if(USER_KEY)auth();
</script>
</body>
</html>
