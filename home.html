<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steal An Egg Overlay V5.42</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090d;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
main{width:min(760px,94vw);background:#111720;border:1px solid #2b3542;border-radius:20px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
h1{font-size:32px;margin:0 0 8px}.sub{color:#b9c3d0;margin:0 0 18px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
a,button{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#fff;font-weight:1000;border:0;border-radius:16px;padding:18px 14px;background:#1a9cff;cursor:pointer;font-size:17px}
.green{background:#2bdc54;color:#061006}.orange{background:#ffb020;color:#110900}.dark{background:#1b2430}.red{background:#ff5151}
.note{margin-top:18px;color:#9aa7b7;font-size:13px;line-height:1.45}
#status{margin-bottom:14px;font-weight:900;color:#ffd75a}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>

<link rel="icon" href="favicon.ico?v=557autoupdate" sizes="any">
<link rel="shortcut icon" href="favicon.ico?v=557autoupdate">
<link rel="apple-touch-icon" href="assets/avatar_icon.png?v=557autoupdate">
<link rel="manifest" href="manifest.webmanifest?v=557autoupdate">
<meta name="theme-color" content="#0b0d11">
</head>
<body>
<main>
<h1>🥚 Steal An Egg Overlay</h1>
<p class="sub">Bạn đã đăng nhập bằng key người dùng. Key này chỉ dùng Control / Avatar / Overlay, không có quyền tạo key.</p>
<div id="status">Đang kiểm tra key...</div>
<div class="grid">
<a id="controlLink" class="green" href="#">Control Overlay</a>
<a id="avatarLink" class="orange" href="#">Avatar Overlay Setup</a>
<a id="mainOverlay" class="dark" href="#" target="_blank">Mở Overlay Chính</a>
<a id="avatarOverlay" class="dark" href="#" target="_blank">Mở Overlay Avatar</a>
<button id="logout" class="red">Đăng xuất key</button>
</div>
<div class="note">Muốn tạo key mới phải vào trang Admin và nhập Admin Key riêng.</div>
</main>
<script>
const CFG=window.SAE_CONFIG||{};
const API=(CFG.backend||"https://steal-an-egg-overlay-backend.leducho1900.workers.dev").replace(/\/+$/,"");
const URLP=new URLSearchParams(location.search);
let USER_KEY=(URLP.get("key")||localStorage.getItem("sae_user_key")||"").trim();
let ROOM=URLP.get("room")||localStorage.getItem("sae_user_room")||"";
const DEVICE_STORE="sae_device_id_v1";
let DEVICE_ID=localStorage.getItem(DEVICE_STORE);
if(!DEVICE_ID){DEVICE_ID="dev_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(DEVICE_STORE,DEVICE_ID)}
function loginRedirect(){
 const u=new URL("login.html",location.href);
 u.searchParams.set("v","537");
 u.searchParams.set("next","control.html?v=557autoupdate");
 location.href=u.href;
}
function make(file, params={}){
 const u=new URL(file,location.href);
 for(const [k,v] of Object.entries(params))if(v)u.searchParams.set(k,v);
 return u.href;
}
async function auth(){
 if(!USER_KEY)return loginRedirect();
 try{
  const r=await fetch(`${API}/auth?_=${Date.now()}`,{
   method:"POST",mode:"cors",cache:"no-store",
   headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
   body:JSON.stringify({key:USER_KEY,deviceId:DEVICE_ID})
  });
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error(data.error||"auth_failed");
  ROOM=data.room;
  localStorage.setItem("sae_user_key",USER_KEY);
  localStorage.setItem("sae_user_room",ROOM);
  status.textContent="Key OK. Đã vào web.";
  status.style.color="#55ff78";
  controlLink.href=make("control.html",{v:"537",key:USER_KEY,room:ROOM});
  avatarLink.href=make("avatar.html",{v:"537",key:USER_KEY,room:ROOM});
  mainOverlay.href=make("index.html",{v:"537",room:ROOM});
  avatarOverlay.href=make("avatar_overlay.html",{v:"537",room:ROOM});
 }catch(e){
  localStorage.removeItem("sae_user_key");
  localStorage.removeItem("sae_user_room");
  loginRedirect();
 }
}
logout.onclick=()=>{
 localStorage.removeItem("sae_user_key");
 localStorage.removeItem("sae_user_room");
 loginRedirect();
};
auth();
</script>
</body>
</html>
