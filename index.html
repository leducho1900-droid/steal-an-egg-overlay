<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
#stage{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:1.6vh 1.4vw;
  background:transparent;
}
#grid{
  --gap:6px;
  width:min(97vw,1535px);
  display:flex;
  flex-wrap:wrap;
  gap:var(--gap);
  perspective:1100px;
  align-items:flex-start;
  justify-content:center;
}
.slot{
  position:relative;
  aspect-ratio:0.705;
  min-width:0;
}
.slot.is-hidden{
  display:none; /* không tạo ảnh phụ, thẻ tắt biến mất thật */
}
.card3d{
  position:absolute;inset:0;
  transform-origin:50% 50%;
  transform-style:preserve-3d;
  will-change:transform;
  container-type:inline-size;
}
.card3d.single-move{
  z-index:20;
  animation:singleCard3D 1.35s cubic-bezier(.22,.72,.25,1) 1;
}
.card-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;
  user-select:none;pointer-events:none;
  image-rendering:auto;
  -webkit-font-smoothing:antialiased;
  backface-visibility:hidden;
}

/* V5.7 — PET đứng yên 100%.
   CHỈ hiệu ứng bảy màu thu vào 4 giây rồi bung ra 3 giây. */
.pet-hole{display:none!important;}
.pet-fx-group{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  transform:none!important;
  animation:none!important;
}
.pet-pixels{display:none!important;}
.pet-aura{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;

  background:
    linear-gradient(
      125deg,
      #ff3040 0%,
      #ff9a2f 14%,
      #ffe52f 28%,
      #42ed61 42%,
      #31e8ef 56%,
      #3f72ff 70%,
      #a94dff 84%,
      #ff3ea5 100%
    );
  background-size:280% 280%;

  -webkit-mask-image:var(--pet-mask);
  mask-image:var(--pet-mask);
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;

  /* Bám theo form pet, nét hơn, không lem ra viền */
  mix-blend-mode:soft-light;
  opacity:.70;
  filter:saturate(1.10) contrast(1.02);

  transform-origin:50% 67%;
  will-change:transform,opacity,background-position;
  animation:
    auraHoldShrinkWaitExpand 10s ease-in-out infinite,
    rainbowFlow 4s linear infinite;
}

/* 0→4 giây: aura thu nhỏ dần vào giữa rồi biến mất.
   4→7 giây: aura bung dần ra lại full pet.
   PET hoàn toàn đứng yên. */
@keyframes auraHoldShrinkWaitExpand{
  0%,30%{
    transform:scale(1);
    opacity:.70;       /* full pet, giữ lại một lúc */
  }
  46%{
    transform:scale(.02);
    opacity:0;         /* thu vào rồi biến mất */
  }
  74%{
    transform:scale(.02);
    opacity:0;         /* nghỉ khoảng 4 giây */
  }
  100%{
    transform:scale(1);
    opacity:.70;       /* bung ra lại */
  }
}
@keyframes rainbowFlow{
  0%   { background-position:0% 50%; }
  50%  { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}
  50%  { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}
  50%  { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}
  50%  { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}
  50%  { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

/* Luminous Eggs: đổi X100/X200...X1000 bằng text tự tạo.
   Chỉ phủ đúng dòng X100 trên thẻ trứng, không đụng pet/card khác. */
.egg-mult-cover{
  display:none!important;
}
.egg-mult-text{

  right:3.5%;
  top:3.2%;
  height:18.8%;

  filter:saturate(1.35) brightness(1.08);
}

/* Chỉ che dòng tiền CŨ trên giao diện. File PNG gốc không bị chỉnh sửa. */

.qty-badge{

  top:0.7%;
  right:1.2%;
  z-index:8;
  display:none;
  align-items:center;
  justify-content:center;
  min-width:21%;

  padding:0 1.2%;

  line-height:1;
  font-weight:1000;
  letter-spacing:-.07em;
  white-space:nowrap;

  paint-order:stroke fill;

.qty-badge.show{display:flex!important;visibility:visible!important;opacity:1!important}

/* Bố cục tự gom thẻ đang bật, không clone/không sinh thêm ảnh */
#grid.count-1{width:min(30vw,420px)}
#grid.count-1 .slot{flex:0 0 100%}

#grid.count-2{width:min(58vw,820px)}
#grid.count-2 .slot{flex:0 0 calc((100% - var(--gap))/2)}

#grid.count-3 .slot,#grid.count-4 .slot{flex:0 0 calc((100% - var(--gap))/2)}

#grid.count-5 .slot,#grid.count-6 .slot{

#grid.count-7,#grid.count-8,#grid.count-9{

#grid.count-7 .slot,#grid.count-8 .slot,#grid.count-9 .slot{

#grid.count-10{

/* Flex + justify-content:center tự canh giữa hàng cuối:
   3 ảnh = 2 trên + 1 dưới giữa.
   5 ảnh = 3 trên + 2 dưới giữa.
   6 ảnh = 3 trên + 3 dưới.
   7/8/9/10 cứ lặp lại 3 ảnh mỗi hàng, hàng cuối tự giữa. */

@keyframes singleCard3D{
  0%{transform:perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)}
  22%{transform:perspective(900px) rotateX(-2.1deg) rotateY(4deg) scale(.975)}
  55%{transform:perspective(900px) rotateX(2.2deg) rotateY(-4deg) scale(1.075)}
  78%{transform:perspective(900px) rotateX(-.7deg) rotateY(1.2deg) scale(1.025)}
  100%{transform:perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)}
}
@media(max-aspect-ratio:1/1){

    grid-template-columns:repeat(2,minmax(0,1fr));width:min(86vw,760px)
  }
}

<script>
const CFG=window.SAE_CONFIG;
const defaults={version:CFG.version,cards:{}};
for(const c of CFG.cards) defaults.cards[c.id]={enabled:true,weight:1,mutations:[],qty:1,eggMult:c.id==="luminous_eggs"?100:undefined};
let state=structuredClone(defaults);
let newestStateTime=0;
const SHARED_KEY="sae-live-state-v3";
let bc=null;
try{bc=new BroadcastChannel("sae-overlay-v3")}catch(_e){}

function clampWeight(v){
  v=Number(v);
  if(!Number.isFinite(v)) v=1;
  return Math.max(1,Math.min(1000,v));
}

/*
 Weight trong app là tỷ lệ weight 1–1000:
 Weight 1 = đúng tiền gốc của pet.
 Sau đó dùng đường cong size client: Scale=cuberoot(weight ratio).
*/
function sizeFactor(weight){
  const scale=Math.cbrt(clampWeight(weight));
  return scale<=5
    ? Math.pow(scale,1.85)
    : 19.637875755794113*Math.pow(scale/5,1.2);
}
function mutationFactor(list){
  let f=1;
  for(const key of [...new Set(list||[])]){
    const m=CFG.mutations[key]?.multiplier||1;
    f += Math.max(0,m-1);
  }
  return f;
}
function trim(v){
  if(v>=100) return Math.round(v).toLocaleString("en-US");
  return (Math.round(v*10)/10).toLocaleString("en-US",{maximumFractionDigits:1});
}
function fmt(n){
  n=Math.round(n);
  if(n>=1e18)return"$"+trim(n/1e18)+"Qi/s";
  if(n>=1e15)return"$"+trim(n/1e15)+"Q/s";
  if(n>=1e12)return"$"+trim(n/1e12)+"T/s";
  if(n>=1e9)return"$"+trim(n/1e9)+"B/s";
  if(n>=1e6)return"$"+trim(n/1e6)+"M/s";
  if(n>=1e3)return"$"+trim(n/1e3)+"K/s";
  return"$"+n.toLocaleString("en-US")+"/s";
}
function fitText(el){
  el.style.transform="scaleX(1)";
  requestAnimationFrame(()=>{
    const max=el.clientWidth;
    const need=el.scrollWidth;
    if(need>max && need>0) el.style.transform=`scaleX(${Math.max(.72,max/need)})`;
  });
}
function updateLayout(){
  const grid=document.getElementById("grid");
  grid.className="";
  const visible=CFG.cards.filter(c=>(state.cards[c.id]||defaults.cards[c.id]).enabled!==false);
  grid.classList.add(`count-${visible.length}`);
  document.querySelectorAll(".slot").forEach((el,i)=>el.style.order=i+1);

  /* Khi còn đúng 3 ảnh và có Mecha Dreadscale + Luminous Eggs:
     ưu tiên 2 ảnh này ở hàng trên; ảnh còn lại nằm dưới giữa. */
  if(visible.length===3){
    const ids=new Set(visible.map(c=>c.id));
    if(ids.has("mecha_dreadscale") && ids.has("luminous_eggs")){
      const mecha=document.querySelector('[data-card="mecha_dreadscale"]');
      const eggs=document.querySelector('[data-card="luminous_eggs"]');
      if(mecha)mecha.style.order=1;
      if(eggs)eggs.style.order=2;
      let order=3;
      for(const c of visible){
        if(c.id!=="mecha_dreadscale" && c.id!=="luminous_eggs"){
          const el=document.querySelector(`[data-card="${c.id}"]`);
          if(el)el.style.order=order++;
        }
      }
    }
  }
}
function render(){
  for(const c of CFG.cards){
    const el=document.querySelector(`[data-card="${c.id}"]`);
    const s=state.cards[c.id]||defaults.cards[c.id];
    el.classList.toggle("is-hidden",!s.enabled);
    if(c.id==="luminous_eggs"){
      const m=Math.max(100,Math.min(1000,Math.round(Number(s.eggMult)||100)));
      const t=el.querySelector("[data-eggmult]");
      if(t)t.textContent=`X${m}`;
    }
    if(c.dynamic){
      const val=c.base*sizeFactor(s.weight)*mutationFactor(s.mutations);
      const p=el.querySelector("[data-price]");
      p.textContent=fmt(val);
      fitText(p);

      const qb=el.querySelector("[data-qty]");
      if(qb){
        const q=Math.max(1,Math.min(10,Math.round(Number(s.qty)||1)));
        const show=q>1;
        qb.textContent=show?`x${q}`:"";
        qb.classList.toggle("show",show);
        qb.style.display=show?"flex":"none";
        qb.style.visibility=show?"visible":"hidden";
        qb.style.opacity=show?"1":"0";
      }
    }
  }
  updateLayout();
}
function applyIncoming(obj){
  if(!obj||!obj.cards)return;
  const ts=Number(obj.updatedAt)||0;
  if(ts && ts<newestStateTime)return;
  if(ts)newestStateTime=ts;
  for(const c of CFG.cards){
    if(obj.cards[c.id]){
      const oldBaseState = String(obj.version||"")!=="5.6-base13";
      const forceBase13 = c.id==="luminous_cthulhu" && oldBaseState;
      state.cards[c.id]={
        ...state.cards[c.id],
        enabled:obj.cards[c.id].enabled!==false,
        weight:forceBase13 ? 1 : clampWeight(obj.cards[c.id].weight),
        mutations:forceBase13 ? [] :
          (Array.isArray(obj.cards[c.id].mutations)?obj.cards[c.id].mutations:[]),
        qty:(obj.cards[c.id].qty==null ? (state.cards[c.id].qty||1) :
          Math.max(1,Math.min(10,Math.round(Number(obj.cards[c.id].qty)||1)))),
        eggMult:c.id==="luminous_eggs"
          ? Math.max(100,Math.min(1000,Math.round(Number(obj.cards[c.id].eggMult)||state.cards[c.id].eggMult||100)))
          : state.cards[c.id].eggMult
      };
    }
  }
  render();
}

/* V5.1: Cloudflare D1 + long-poll.
   Không dùng Cache API nên không còn state khác nhau giữa các data center. */
const API=(CFG.backend||"").replace(/\/+$/,"");
const ROOM=CFG.room||"";
let cloudRev=0;
let waitBusy=false;

async function loadInitialState(){
  if(!API||!ROOM)return;
  try{
    const r=await fetch(`${API}/state?room=${encodeURIComponent(ROOM)}&_=${Date.now()}`,{
      method:"GET",mode:"cors",cache:"no-store",
      headers:{"Cache-Control":"no-cache"}
    });
    if(!r.ok)return;
    const data=await r.json();
    if(data&&data.ok){
      cloudRev=Math.max(cloudRev,Number(data.rev)||0);
      if(data.state)applyIncoming(data.state);
    }
  }catch(_e){}
}

async function waitForCloudChange(){
  if(waitBusy||!API||!ROOM)return;
  waitBusy=true;
  try{
    const r=await fetch(
      `${API}/wait?room=${encodeURIComponent(ROOM)}&since=${encodeURIComponent(cloudRev)}&_=${Date.now()}`,
      {method:"GET",mode:"cors",cache:"no-store",headers:{"Cache-Control":"no-cache"}}
    );
    if(r.ok){
      const data=await r.json();
      if(data&&data.ok){
        cloudRev=Math.max(cloudRev,Number(data.rev)||0);
        if(data.changed&&data.state)applyIncoming(data.state);
      }
    }
  }catch(_e){
    await new Promise(resolve=>setTimeout(resolve,650));
  }finally{
    waitBusy=false;
    setTimeout(waitForCloudChange,20);
  }
}
/* CHỈ MỘT THẺ chuyển động mỗi lần. Không clone, không tạo ảnh phụ. */
let moveCursor=0;
function moveOneCard(){
  document.querySelectorAll(".card3d.single-move").forEach(x=>x.classList.remove("single-move"));
  const enabled=CFG.cards
    .map(c=>document.querySelector(`[data-card="${c.id}"]`))
    .filter(el=>el&&!el.classList.contains("is-hidden"));
  if(!enabled.length)return;
  const slot=enabled[moveCursor%enabled.length];
  moveCursor++;
  const card=slot.querySelector(".card3d");
  void card.offsetWidth;
  card.classList.add("single-move");
  setTimeout(()=>card.classList.remove("single-move"),1400);
}
try{
  const local=JSON.parse(localStorage.getItem(SHARED_KEY)||"null");
  if(local)applyIncoming(local);
}catch(_e){}
window.addEventListener("storage",e=>{if(e.key===SHARED_KEY&&e.newValue){try{applyIncoming(JSON.parse(e.newValue))}catch(_e){}}});
if(bc)bc.onmessage=e=>applyIncoming(e.data);
render();
loadInitialState().finally(()=>waitForCloudChange());
setTimeout(()=>{moveOneCard();setInterval(moveOneCard,2450)},900);
</script>
