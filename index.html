<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Steal An Egg Overlay V5.2 BIG QUANTITY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
#stage{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:1.6vh 1.4vw;
  background:transparent;
}
#grid{
  --gap:6px;
  width:min(97vw,1535px);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:var(--gap);
  perspective:1100px;
  align-items:start;
  justify-content:center;
}
.slot{
  position:relative;
  aspect-ratio:0.705;
  min-width:0;
}
.slot.is-hidden{
  display:none; /* không tạo ảnh phụ, thẻ tắt biến mất thật */
}
.card3d{
  position:absolute;inset:0;
  transform-origin:50% 50%;
  transform-style:preserve-3d;
  will-change:transform;
  container-type:inline-size;
}
.card3d.single-move{
  z-index:20;
  animation:singleCard3D 1.35s cubic-bezier(.22,.72,.25,1) 1;
}
.card-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;
  user-select:none;pointer-events:none;
  image-rendering:auto;
  -webkit-font-smoothing:antialiased;
  backface-visibility:hidden;
}
/* Chỉ che dòng tiền CŨ trên giao diện. File PNG gốc không bị chỉnh sửa. */
.price-cover{
  position:absolute;
  left:7.5%;right:7.5%;top:27.35%;height:12.55%;
  z-index:2;
  background:
    repeating-linear-gradient(135deg,
      rgba(255,255,255,.14) 0 9px,
      rgba(255,255,255,0) 9px 23px),
    linear-gradient(180deg,#a9eaf7 0%,#9be2f3 100%);
  border-radius:2px;
}
.price-text{
  position:absolute;
  left:3.8%;right:3.8%;top:27.05%;height:13.25%;
  z-index:3;
  display:flex;align-items:center;justify-content:center;
  overflow:visible;
  color:#60EF01; /* lấy gần đúng màu xanh của chữ tiền gốc */
  font-family:"Arial Black","DejaVu Sans",Arial,sans-serif;
  font-weight:1000;
  font-size:16.2cqw;
  line-height:.92;
  letter-spacing:-.075em;
  white-space:nowrap;
  -webkit-text-stroke:1.05cqw #020202;
  paint-order:stroke fill;
  text-shadow:0 .35cqw 0 #000;
  transform-origin:center center;
  -webkit-font-smoothing:antialiased;
}


.qty-badge{
  position:absolute;
  top:1.5%;
  right:2.2%;
  z-index:8;
  display:none;
  align-items:center;
  justify-content:center;
  min-width:16.5%;
  height:9.4%;
  padding:0 .9%;
  color:#fff;
  font-family:"Arial Black","DejaVu Sans",Arial,sans-serif;
  font-size:9.2cqw;
  line-height:1;
  font-weight:1000;
  letter-spacing:-.07em;
  white-space:nowrap;
  -webkit-text-stroke:.68cqw #050505;
  paint-order:stroke fill;
  text-shadow:0 .28cqw 0 #000;
  background:transparent;
  border:0;
  border-radius:0;
  pointer-events:none;
  transform:none;
  transform-origin:center;
}
.qty-badge.show{display:flex!important;visibility:visible!important;opacity:1!important}

/* Bố cục tự gom thẻ đang bật, không clone/không sinh thêm ảnh */
#grid.count-1{grid-template-columns:1fr;width:min(28vw,300px)}
#grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr));width:min(42vw,560px)}
#grid.count-3{grid-template-columns:repeat(2,minmax(0,1fr));width:min(42vw,560px)}
#grid.count-4{grid-template-columns:repeat(2,minmax(0,1fr));width:min(52vw,700px)}
#grid.count-5{grid-template-columns:repeat(5,minmax(0,1fr));width:min(78vw,1180px)}
#grid.count-6,#grid.count-7,#grid.count-8,#grid.count-9,#grid.count-10{
  grid-template-columns:repeat(5,minmax(0,1fr));
  width:min(97vw,1535px);
}
#grid.focus-three .slot[data-card="mecha_dreadscale"]{order:1}
#grid.focus-three .slot[data-card="luminous_eggs"]{order:2}
#grid.focus-three .slot[data-card="aetheron"]{
  order:3;
  grid-column:1 / -1;
  justify-self:center;
  width:calc((100% - var(--gap))/2);
}

@keyframes singleCard3D{
  0%{transform:perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)}
  22%{transform:perspective(900px) rotateX(-2.1deg) rotateY(4deg) scale(.975)}
  55%{transform:perspective(900px) rotateX(2.2deg) rotateY(-4deg) scale(1.075)}
  78%{transform:perspective(900px) rotateX(-.7deg) rotateY(1.2deg) scale(1.025)}
  100%{transform:perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)}
}
@media(max-aspect-ratio:1/1){
  #stage{align-items:center;overflow:hidden;padding:8px}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));width:min(92vw,800px);gap:6px}
  #grid.count-1{grid-template-columns:1fr;width:min(35vw,330px)}
  #grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr));width:min(55vw,560px)}
  #grid.count-3{grid-template-columns:repeat(2,minmax(0,1fr));width:min(55vw,560px)}
  #grid.count-4{grid-template-columns:repeat(2,minmax(0,1fr));width:min(66vw,680px)}
  #grid.count-5,#grid.count-6,#grid.count-7,#grid.count-8,#grid.count-9,#grid.count-10{
    grid-template-columns:repeat(2,minmax(0,1fr));width:min(86vw,760px)
  }
}
</style>
</head>
<body>
<div id="stage"><div id="grid">
    <div class="slot" data-card="kitsune">
      <div class="card3d">
        <img class="card-img" src="cards/kitsune.png" alt="Kitsune" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="luminous_cthulhu">
      <div class="card3d">
        <img class="card-img" src="cards/luminous_cthulhu.png" alt="Luminous Cthulhu" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="archangel">
      <div class="card3d">
        <img class="card-img" src="cards/archangel.png" alt="ArchAngel" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="aetheron">
      <div class="card3d">
        <img class="card-img" src="cards/aetheron.png" alt="Aetheron" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="world_burner_cthulhu">
      <div class="card3d">
        <img class="card-img" src="cards/world_burner_cthulhu.png" alt="World Burner Cthulhu" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="shattered_colossus">
      <div class="card3d">
        <img class="card-img" src="cards/shattered_colossus.png" alt="Shattered Colossus" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="nightflame">
      <div class="card3d">
        <img class="card-img" src="cards/nightflame.png" alt="Nightflame" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="luminous_eggs">
      <div class="card3d">
        <img class="card-img" src="cards/luminous_eggs.png" alt="Luminous Eggs" draggable="false">
        
      </div>
    </div>
    <div class="slot" data-card="cthulhu">
      <div class="card3d">
        <img class="card-img" src="cards/cthulhu.png" alt="Cthulhu" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div>
    <div class="slot" data-card="mecha_dreadscale">
      <div class="card3d">
        <img class="card-img" src="cards/mecha_dreadscale.png" alt="Mecha Dreadscale" draggable="false">
        <div class="qty-badge" data-qty></div>
        <div class="price-cover" aria-hidden="true"></div><div class="price-text" data-price></div>
      </div>
    
    </div></div></div>
<script src="config.js"></script>
<script>
const CFG=window.SAE_CONFIG;
const defaults={version:CFG.version,cards:{}};
for(const c of CFG.cards) defaults.cards[c.id]={enabled:true,weight:1,mutations:[],qty:1};
let state=structuredClone(defaults);
let newestStateTime=0;
const SHARED_KEY="sae-live-state-v3";
let bc=null;
try{bc=new BroadcastChannel("sae-overlay-v3")}catch(_e){}

function clampWeight(v){
  v=Number(v);
  if(!Number.isFinite(v)) v=1;
  return Math.max(1,Math.min(1000,v));
}

/*
 Weight trong app là tỷ lệ weight 1–1000:
 Weight 1 = đúng tiền gốc của pet.
 Sau đó dùng đường cong size client: Scale=cuberoot(weight ratio).
*/
function sizeFactor(weight){
  const scale=Math.cbrt(clampWeight(weight));
  return scale<=5
    ? Math.pow(scale,1.85)
    : 19.637875755794113*Math.pow(scale/5,1.2);
}
function mutationFactor(list){
  let f=1;
  for(const key of [...new Set(list||[])]){
    const m=CFG.mutations[key]?.multiplier||1;
    f += Math.max(0,m-1);
  }
  return f;
}
function trim(v){
  if(v>=100) return Math.round(v).toLocaleString("en-US");
  return (Math.round(v*10)/10).toLocaleString("en-US",{maximumFractionDigits:1});
}
function fmt(n){
  n=Math.round(n);
  if(n>=1e18)return"$"+trim(n/1e18)+"Qi/s";
  if(n>=1e15)return"$"+trim(n/1e15)+"Q/s";
  if(n>=1e12)return"$"+trim(n/1e12)+"T/s";
  if(n>=1e9)return"$"+trim(n/1e9)+"B/s";
  if(n>=1e6)return"$"+trim(n/1e6)+"M/s";
  if(n>=1e3)return"$"+trim(n/1e3)+"K/s";
  return"$"+n.toLocaleString("en-US")+"/s";
}
function fitText(el){
  el.style.transform="scaleX(1)";
  requestAnimationFrame(()=>{
    const max=el.clientWidth;
    const need=el.scrollWidth;
    if(need>max && need>0) el.style.transform=`scaleX(${Math.max(.72,max/need)})`;
  });
}
function updateLayout(){
  const grid=document.getElementById("grid");
  grid.className="";
  const visible=CFG.cards.filter(c=>(state.cards[c.id]||defaults.cards[c.id]).enabled!==false);
  grid.classList.add(`count-${visible.length}`);
  document.querySelectorAll(".slot").forEach((el,i)=>el.style.order=i+1);

  const ids=new Set(visible.map(c=>c.id));
  const exactThree=visible.length===3 &&
    ids.has("mecha_dreadscale") && ids.has("luminous_eggs") && ids.has("aetheron");

  if(exactThree){
    grid.classList.add("focus-three");
    document.querySelector('[data-card="mecha_dreadscale"]').style.order=1;
    document.querySelector('[data-card="luminous_eggs"]').style.order=2;
    document.querySelector('[data-card="aetheron"]').style.order=3;
  }else{
    grid.classList.remove("focus-three");
  }
}
function render(){
  for(const c of CFG.cards){
    const el=document.querySelector(`[data-card="${c.id}"]`);
    const s=state.cards[c.id]||defaults.cards[c.id];
    el.classList.toggle("is-hidden",!s.enabled);
    if(c.dynamic){
      const val=c.base*sizeFactor(s.weight)*mutationFactor(s.mutations);
      const p=el.querySelector("[data-price]");
      p.textContent=fmt(val);
      fitText(p);

      const qb=el.querySelector("[data-qty]");
      if(qb){
        const q=Math.max(1,Math.min(10,Math.round(Number(s.qty)||1)));
        const show=q>1;
        qb.textContent=show?`x${q}`:"";
        qb.classList.toggle("show",show);
        qb.style.display=show?"flex":"none";
        qb.style.visibility=show?"visible":"hidden";
        qb.style.opacity=show?"1":"0";
      }
    }
  }
  updateLayout();
}
function applyIncoming(obj){
  if(!obj||!obj.cards)return;
  const ts=Number(obj.updatedAt)||0;
  if(ts && ts<newestStateTime)return;
  if(ts)newestStateTime=ts;
  for(const c of CFG.cards){
    if(obj.cards[c.id]){
      state.cards[c.id]={
        ...state.cards[c.id],
        enabled:obj.cards[c.id].enabled!==false,
        weight:clampWeight(obj.cards[c.id].weight),
        mutations:Array.isArray(obj.cards[c.id].mutations)?obj.cards[c.id].mutations:[],
        qty:(obj.cards[c.id].qty==null ? (state.cards[c.id].qty||1) :
          Math.max(1,Math.min(10,Math.round(Number(obj.cards[c.id].qty)||1))))
      };
    }
  }
  render();
}

/* V5.1: Cloudflare D1 + long-poll.
   Không dùng Cache API nên không còn state khác nhau giữa các data center. */
const API=(CFG.backend||"").replace(/\/+$/,"");
const ROOM=CFG.room||"";
let cloudRev=0;
let waitBusy=false;

async function loadInitialState(){
  if(!API||!ROOM)return;
  try{
    const r=await fetch(`${API}/state?room=${encodeURIComponent(ROOM)}&_=${Date.now()}`,{
      method:"GET",mode:"cors",cache:"no-store",
      headers:{"Cache-Control":"no-cache"}
    });
    if(!r.ok)return;
    const data=await r.json();
    if(data&&data.ok){
      cloudRev=Math.max(cloudRev,Number(data.rev)||0);
      if(data.state)applyIncoming(data.state);
    }
  }catch(_e){}
}

async function waitForCloudChange(){
  if(waitBusy||!API||!ROOM)return;
  waitBusy=true;
  try{
    const r=await fetch(
      `${API}/wait?room=${encodeURIComponent(ROOM)}&since=${encodeURIComponent(cloudRev)}&_=${Date.now()}`,
      {method:"GET",mode:"cors",cache:"no-store",headers:{"Cache-Control":"no-cache"}}
    );
    if(r.ok){
      const data=await r.json();
      if(data&&data.ok){
        cloudRev=Math.max(cloudRev,Number(data.rev)||0);
        if(data.changed&&data.state)applyIncoming(data.state);
      }
    }
  }catch(_e){
    await new Promise(resolve=>setTimeout(resolve,650));
  }finally{
    waitBusy=false;
    setTimeout(waitForCloudChange,20);
  }
}
/* CHỈ MỘT THẺ chuyển động mỗi lần. Không clone, không tạo ảnh phụ. */
let moveCursor=0;
function moveOneCard(){
  document.querySelectorAll(".card3d.single-move").forEach(x=>x.classList.remove("single-move"));
  const enabled=CFG.cards
    .map(c=>document.querySelector(`[data-card="${c.id}"]`))
    .filter(el=>el&&!el.classList.contains("is-hidden"));
  if(!enabled.length)return;
  const slot=enabled[moveCursor%enabled.length];
  moveCursor++;
  const card=slot.querySelector(".card3d");
  void card.offsetWidth;
  card.classList.add("single-move");
  setTimeout(()=>card.classList.remove("single-move"),1400);
}
try{
  const local=JSON.parse(localStorage.getItem(SHARED_KEY)||"null");
  if(local)applyIncoming(local);
}catch(_e){}
window.addEventListener("storage",e=>{if(e.key===SHARED_KEY&&e.newValue){try{applyIncoming(JSON.parse(e.newValue))}catch(_e){}}});
if(bc)bc.onmessage=e=>applyIncoming(e.data);
render();
loadInitialState().finally(()=>waitForCloudChange());
setTimeout(()=>{moveOneCard();setInterval(moveOneCard,2450)},900);
</script>
</body>
</html>
