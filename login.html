<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập Key V5.42</title>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090d;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
main{width:min(560px,94vw);background:#111820;border:1px solid #2b3542;border-radius:22px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
h1{font-size:32px;margin:0 0 8px}.sub{color:#aab7c6;line-height:1.45;margin:0 0 18px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #3b4552;background:#070a0f;color:#fff;font-weight:1000;font-size:16px;text-transform:uppercase}
button{width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:1000;cursor:pointer;color:#061008;background:#35e35e;margin-top:12px;font-size:16px}
button:disabled{opacity:.55;cursor:not-allowed}
#status{margin-top:12px;color:#aab7c6;font-weight:900;min-height:22px}
small{display:block;color:#8897a8;margin-top:14px;line-height:1.45}
</style>

<link rel="icon" href="favicon.ico?v=554priceclear" sizes="any">
<link rel="shortcut icon" href="favicon.ico?v=554priceclear">
<link rel="apple-touch-icon" href="assets/avatar_icon.png?v=554priceclear">
<link rel="manifest" href="manifest.webmanifest?v=554priceclear">
<meta name="theme-color" content="#0b0d11">
</head>
<body>
<main>
<h1>🔑 Nhập key để vào web</h1>
<p class="sub">Nhập key thường để vào Control. Nhập key chủ Admin thì sẽ vào phần tạo key.</p>
<input id="keyInput" placeholder="NHẬP KEY" autocomplete="off">
<button id="loginBtn" type="button">Đăng nhập</button>
<div id="status">Sẵn sàng nhập key.</div>
<small>Key thường không thấy mục Admin. Chỉ key chủ Admin mới mở phần tạo key.</small>
</main>

<script>
(function(){
  const CFG = window.SAE_CONFIG || {};
  const API = String(CFG.backend || "https://steal-an-egg-overlay-backend.leducho1900.workers.dev").replace(/\/+$/,"");
  const keyInput = document.getElementById("keyInput");
  const loginBtn = document.getElementById("loginBtn");
  const statusEl = document.getElementById("status");
  const URLP = new URLSearchParams(location.search);
  const NEXT = URLP.get("next") || "control.html?v=554priceclear";
  const DEVICE_STORE = "sae_device_id_v1";
  let DEVICE_ID = localStorage.getItem(DEVICE_STORE);

  if(!DEVICE_ID){
    DEVICE_ID = "dev_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(DEVICE_STORE, DEVICE_ID);
  }

  keyInput.value = (URLP.get("key") || localStorage.getItem("sae_user_key") || localStorage.getItem("sae_admin_key") || "").trim();

  function setStatus(t,c="#aab7c6"){
    statusEl.textContent = t;
    statusEl.style.color = c;
  }

  async function readJsonSafe(r){
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(_e){ return {ok:false,error:txt || "not_json"}; }
  }

  async function login(){
    const key = keyInput.value.trim();
    if(!key){ setStatus("Nhập key trước", "#ff6b6b"); return; }

    loginBtn.disabled = true;
    setStatus("Đang kiểm tra key...", "#ffd75a");

    try{
      const r = await fetch(`${API}/auth?_=${Date.now()}`, {
        method:"POST",
        mode:"cors",
        cache:"no-store",
        headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
        body:JSON.stringify({key, deviceId:DEVICE_ID})
      });

      const data = await readJsonSafe(r);

      if(!r.ok || !data.ok){
        let msg = "Sai key / key hết hạn / key đã bị xóa / key đã khóa ở máy khác";
        if(data.error === "not_found") msg = "Worker chưa update code V5.42 nên chưa có /auth";
        if(data.error === "missing_D1_binding_DB") msg = "Worker thiếu D1 binding DB";
        throw new Error(msg);
      }

      if(data.admin){
        localStorage.setItem("sae_admin_key", key);
        setStatus("Key Admin đúng. Đang vào trang tạo key...", "#55ff78");
        const u = new URL("admin.html?v=554priceclear", location.href);
        setTimeout(()=>{ location.href = u.href; }, 350);
        return;
      }

      localStorage.setItem("sae_user_key", key.toUpperCase());
      localStorage.setItem("sae_user_room", data.room);
      setStatus("Key đúng. Đang vào Control...", "#55ff78");

      const u = new URL(NEXT, location.href);
      u.searchParams.set("key", key.toUpperCase());
      u.searchParams.set("room", data.room);
      setTimeout(()=>{ location.href = u.href; }, 350);
    }catch(e){
      localStorage.removeItem("sae_user_key");
      localStorage.removeItem("sae_user_room");
      setStatus(e.message || "Không kết nối được Worker / sai key", "#ff6b6b");
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener("click", login);
  keyInput.addEventListener("keydown", e => { if(e.key === "Enter") login(); });
})();
</script>
</body>
</html>
